appId: "com.github.VeltuneGroup.Veltune-Desktop"
productName: "YouTube Music"
publish:
  - provider: generic
    url: https://github.com/VeltuneGroup/Veltune-Desktop/releases/download/latest
files:
  - '!*'
  - dist
  - assets
  - license
  - '!node_modules'
  - 'node_modules/custom-electron-prompt/**'
  - 'node_modules/@ghostery/adblocker-electron-preload/**'
  - 'node_modules/@ffmpeg.wasm/core-mt/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
asarUnpack:
  - assets
mac:
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/generated/icons/mac/icon.icon
  compression: maximum
win:
  icon: assets/generated/icons/win/icon.ico
  target:
    - target: nsis-web
      arch:
        - x64
        - ia32
        - arm64
    - target: portable
      arch:
        - x64
        - ia32
        - arm64
  compression: maximum
nsisWeb:
  runAfterFinish: false
linux:
  icon: assets/generated/icons/png
  category: AudioVideo
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: "com.github.VeltuneGroup.Veltune_Desktop"
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
        - armv7l
    - target: deb
      arch:
        - x64
        - arm64
        - armv7l
    - target: rpm
      arch:
        - x64
        - arm64
    - target: freebsd
      arch:
        - x64
        - arm64
        - armv7l
    - target: tar.gz
      arch:
        - x64
        - arm64
        - armv7l
appImage:
  description: "\u0059\u006f\u0075\u0054\u0075\u0062\u0065\u0020\u004d\u0075\u0073\u0069\u0063 Desktop App bundled with custom plugins"
  category: AudioVideo
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libasound2
    - libgbm1
rpm:
  depends:
    - libuuid
  fpm:
    - '--rpm-rpmbuild-define'
    - _build_id_links none
directories:
  output: ./pack/
